spring.application.name=licensing-service

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:organizationdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema.sql/data.sql define the schema and sample data - let them run instead of Hibernate auto-DDL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# expose the H2 web console at /h2-console for inspecting the sample data
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
